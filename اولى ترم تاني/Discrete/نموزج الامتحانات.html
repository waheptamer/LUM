<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>امتحان مقدمة البرمجة</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
        font-family:
          Tajawal,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Arial;
      }
      body {
        margin: 0;
        color: #fff;
      }
      #bg-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
      }
      .container {
        max-width: 900px;
        margin: 30px auto;
        background: rgba(0, 0, 0, 0.7);
        padding: 25px;
        border-radius: 15px;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      h2 {
        margin: 0;
        text-align: center;
      }

      .timer-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }
      .timer-text {
        font-weight: 700;
        color: #fffb;
        min-width: 140px;
        text-align: start;
      }
      .timer-danger {
        color: #ff6b6b;
      }
      .timer-wrap {
        width: 100%;
        background: rgba(255, 255, 255, 0.15);
        height: 10px;
        border-radius: 999px;
        overflow: hidden;
      }
      .timer-bar {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #00ff99, #00c6ff);
        transition: width 1s linear;
      }
      .muted {
        color: #fffc;
        font-size: 14px;
        margin-bottom: 10px;
      }

      .group-title {
        color: #00c6ff;
        font-size: 20px;
        text-align: center;
        margin: 22px 0 10px;
      }
      .sub-question {
        background: rgba(255, 255, 255, 0.1);
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 10px;
      }
      .q-text {
        margin-bottom: 8px;
        font-weight: 700;
      }
      label {
        display: block;
        margin: 6px 0;
        cursor: pointer;
      }

      .btn {
        width: 100%;
        padding: 15px;
        font-size: 18px;
        border: none;
        border-radius: 10px;
        background: #00c6ff;
        font-weight: bold;
        cursor: pointer;
        color: #001018;
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .correct-answer {
        color: #00ff99;
      }
      .wrong-answer {
        color: #ff6b6b;
      }
      .explain {
        display: none;
        margin-top: 8px;
        background: rgba(0, 0, 0, 0.4);
        padding: 8px;
        border-radius: 8px;
      }

      .result {
        display: none;
        margin-top: 20px;
        text-align: center;
        font-size: 20px;
      }
    </style>
  </head>

  <body>
    <!-- فيديو الخلفية -->
    <video autoplay muted loop playsinline id="bg-video">
      <source src="خلفيه.mp4" type="video/mp4" />
    </video>

    <div class="container">
      <div class="header">
        <h2>امتحان مقدمة البرمجة</h2>
      </div>

      <!-- العداد -->
      <div class="timer-row" aria-live="polite">
        <div class="timer-text" id="timer-text">الوقت المتبقي: 15:00</div>
        <div class="timer-wrap" aria-hidden="true">
          <div class="timer-bar" id="timer-bar"></div>
        </div>
      </div>
      <div class="muted">* سيتم تسليم الامتحان تلقائيًا عند انتهاء الوقت.</div>

      <!-- ======= المجموعة 1 ======= -->
      <div class="group-title">A={2,{5},7,{8},9}</div>

      <div
        class="sub-question question"
        data-answer="a"
        data-explain="العدد بياخد ∈ "
      >
        <div class="q-text">(1.1)A∈2</div>
        <label><input type="radio" name="g1_q1" value="a" />صح</label>
        <label><input type="radio" name="g1_q1" value="b" />غلط</label>
        <div class="explain"></div>
      </div>

      <div
        class="sub-question question"
        data-answer="b"
        data-explain="العدد بياخد ∈"
      >
        <div class="q-text">1.2) A∈5</div>
        <label><input type="radio" name="g1_q2" value="a" /> صح</label>
        <label><input type="radio" name="g1_q2" value="b" /> غلط </label>
        <div class="explain"></div>
      </div>

      <div
        class="sub-question question"
        data-answer="b"
        data-explain="المجموعه بتاخد ⊆"
      >
        <div class="q-text">1.3) A∈{7}</div>
        <label><input type="radio" name="g1_q3" value="a" /> صح</label>
        <label><input type="radio" name="g1_q3" value="b" /> غلط </label>
        <div class="explain"></div>
      </div>

      <div
        class="sub-question question"
        data-answer="b"
        data-explain="العدد بياخد ∈ مش ⊆"
      >
        <div class="q-text">1.4) A ⊆ 9</div>
        <label><input type="radio" name="g1_q4" value="a" />صح</label>
        <label><input type="radio" name="g1_q4" value="b" />غلط</label>
        <div class="explain"></div>
      </div>

      <div
        class="sub-question question"
        data-answer="b"
        data-explain="المجموعه بتاخد ⊆"
      >
        <div class="q-text">1.5) A ⊆ {8}</div>
        <label><input type="radio" name="g1_q5" value="a" />صح</label>
        <label><input type="radio" name="g1_q5" value="b" />غلط</label>
        <div class="explain"></div>
      </div>

      <div
        class="sub-question question"
        data-answer="a"
        data-explain="الحلقة for تُكرر تنفيذ كتلة تعليمات عِدّة مرات، وليست مرة واحدة."
      >
        <div class="q-text">1.6) A ⊆ {2}</div>
        <label><input type="radio" name="g1_q6" value="a" />صح</label>
        <label><input type="radio" name="g1_q6" value="b" />غلط</label>
        <div class="explain"></div>
      </div>

      <div
        class="sub-question question"
        data-answer="a"
        data-explain="العدد بياخد ∈"
      >
        <div class="q-text">1.7) A ∈ 9</div>
        <label><input type="radio" name="g1_q7" value="a" />صح</label>
        <label><input type="radio" name="g1_q7" value="b" />غلط</label>
        <div class="explain"></div>
      </div>

      <!-- ======= المجموعة 2 ======= -->
      <div class="group-title">B={2,4,6,{8}}</div>

      <div
        class="sub-question question"
        data-answer="a"
        data-explain="المصفوفة Array تُخزّن عدة قيم من نفس النوع في هيكل واحد."
      >
        <div class="q-text">2.1) 2 - - - - B</div>
        <label><input type="radio" name="g2_q1" value="a" /> ∈ </label>
        <label><input type="radio" name="g2_q1" value="b" /> ⊆ </label>
        <div class="explain"></div>
      </div>

      <div
        class="sub-question question"
        data-answer="a"
        data-explain="الدوال يمكن أن تُعيد قيمة باستخدام return (إن كانت معرفة على ذلك)."
      >
        <div class="q-text">2.2) 4 - - - - B</div>
        <label><input type="radio" name="g2_q2" value="a" /> ∈ </label>
        <label><input type="radio" name="g2_q2" value="b" /> ⊆ </label>
        <div class="explain"></div>
      </div>

      <div
        class="sub-question question"
        data-answer="b"
        data-explain="المفسّر Interpreter ينفّذ الشفرة سطرًا بسطر أثناء التشغيل، بعكس المترجم Compiler الذي ينتج ملفًا تنفيذيًا غالبًا."
      >
        <div class="q-text">2.3) {6} - - - - B</div>
        <label><input type="radio" name="g2_q3" value="a" /> ∈ </label>
        <label><input type="radio" name="g2_q3" value="b" /> ⊆ </label>
        <div class="explain"></div>
      </div>

      <div
        class="sub-question question"
        data-answer="a"
        data-explain="عامل المقارنة في أغلب اللغات هو == (أو === في جافاسكربت)، أما = فهي للإسناد."
      >
        <div class="q-text">2.4) {8} - - - - B</div>
        <label><input type="radio" name="g2_q4" value="a" /> ∈ </label>
        <label><input type="radio" name="g2_q4" value="b" /> ⊆ </label>
        <div class="explain"></div>
      </div>

      <div
        class="sub-question question"
        data-answer="b"
        data-explain="عامل المقارنة في أغلب اللغات هو == (أو === في جافاسكربت)، أما = فهي للإسناد."
      >
        <div class="q-text">2.5) {2} - - - - B</div>
        <label><input type="radio" name="g2_q5" value="a" /> ∈ </label>
        <label><input type="radio" name="g2_q5" value="b" /> ⊆ </label>
        <div class="explain"></div>
      </div>

      <button class="btn" id="submit-btn" onclick="submitExam()">
        تسليم الامتحان
      </button>
      <div class="result" id="result"></div>
    </div>

    <script>
      // ======= الإعدادات =======
      const EXAM_DURATION = 900; // 2 دقائق (غيرها حسب رغبتك)
      const AUTO_SUBMIT_ON_TIMEOUT = true;

      // ======= حالة العداد =======
      let timeLeft = EXAM_DURATION;
      let timerId = null;
      let submitted = false;

      const timerTextEl = document.getElementById("timer-text");
      const timerBarEl = document.getElementById("timer-bar");
      const submitBtn = document.getElementById("submit-btn");

      updateTimerUI(timeLeft, EXAM_DURATION);
      startTimer();

      function startTimer() {
        if (timerId) return;
        const start = performance.now();
        const endAt = start + EXAM_DURATION * 1000;

        function tick(now) {
          const msLeft = Math.max(0, endAt - now);
          timeLeft = Math.ceil(msLeft / 1000);
          updateTimerUI(timeLeft, EXAM_DURATION);
          if (msLeft <= 0) {
            handleTimeout();
            return;
          }
          timerId = requestAnimationFrame(tick);
        }
        timerId = requestAnimationFrame(tick);
      }

      function stopTimer() {
        if (timerId) {
          cancelAnimationFrame(timerId);
          timerId = null;
        }
      }

      function handleTimeout() {
        stopTimer();
        lockOptions();
        submitBtn.disabled = true;
        if (AUTO_SUBMIT_ON_TIMEOUT && !submitted) submitExam(true);
        else {
          timerTextEl.textContent = "انتهى الوقت!";
          timerTextEl.classList.add("timer-danger");
        }
      }

      function updateTimerUI(secondsLeft, totalSeconds) {
        timerTextEl.textContent = "الوقت المتبقي: " + formatTime(secondsLeft);
        const dangerThreshold = Math.ceil(totalSeconds * 0.15);
        if (secondsLeft <= dangerThreshold)
          timerTextEl.classList.add("timer-danger");
        else timerTextEl.classList.remove("timer-danger");
        const pct = Math.max(
          0,
          Math.min(100, (secondsLeft / totalSeconds) * 100),
        );
        timerBarEl.style.width = pct + "%";
      }

      function formatTime(totalSec) {
        const m = Math.floor(totalSec / 60),
          s = totalSec % 60;
        return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
      }

      function lockOptions() {
        document
          .querySelectorAll(".question input[type=radio]")
          .forEach((opt) => {
            opt.disabled = true;
          });
      }
      function submitExam(fromTimeout = false) {
        if (submitted) return;
        submitted = true;
        stopTimer();

        let score = 0;
        const questions = document.querySelectorAll(".question");

        questions.forEach((q) => {
          const correct = q.dataset.answer;
          const selected = q.querySelector("input:checked");
          const explain = q.querySelector(".explain");

          // قفل كل الاختيارات + تلوين الصحيح والخطأ
          q.querySelectorAll("input").forEach((opt) => {
            opt.disabled = true;
            if (opt.value === correct)
              opt.parentElement.classList.add("correct-answer");
            if (selected && opt === selected && opt.value !== correct)
              opt.parentElement.classList.add("wrong-answer");
          });

          // حساب الدرجة
          if (selected && selected.value === correct) score++;

          // ❌ إخفاء التفسير بالكامل
          explain.style.display = "none";
          explain.innerHTML = "";
        });

        submitBtn.disabled = true;

        const resEl = document.getElementById("result");
        resEl.style.display = "block";
        resEl.innerHTML =
          `✅ نتيجتك النهائية: ${score} / ${questions.length}` +
          (fromTimeout ? "<br>⏱️ تم التسليم تلقائيًا لانتهاء الوقت." : "");

        resEl.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    </script>
  </body>
</html>
